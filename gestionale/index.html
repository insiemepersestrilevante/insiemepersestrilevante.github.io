<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#174b3b"><title>Gestionale | Insieme per Sestri</title><link rel="icon" href="../app-icon.svg"><style>
:root{--g:#174b3b;--bg:#f3f6f3;--line:#e1e8e2;--ink:#24342d;--muted:#69766f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.top{background:var(--g);color:white;padding:16px max(20px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;object-fit:contain;background:white;border-radius:50%;padding:3px}.wrap{max-width:1100px;margin:32px auto;padding:0 18px}.login,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.login{max-width:420px;margin:8vh auto}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0}p,.hint,small{color:var(--muted)}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd8cf;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 15px;background:var(--g);color:white;font-weight:650;cursor:pointer}.secondary{background:#eaf1ec;color:var(--g)}.wide{width:100%;margin-top:18px}.hidden{display:none!important}.msg{color:#a33b35;font-size:13px;min-height:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat strong{display:block;font-size:28px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.nav button{border:1px solid var(--line);border-radius:20px;padding:8px 13px;background:white;color:var(--g);cursor:pointer}.nav button.active{background:var(--g);color:white}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);background:#f8faf8}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:14px 18px}.wrap{margin:20px auto}}
</style></head><body>
<header class="top"><div class="brand"><img src="../logo.jpeg" alt=""><div><b>Insieme per Sestri</b><div class="hint" style="color:#dce9e1">Gestionale riservato</div></div></div><div id="account" class="hidden"><span id="accountmail"></span> <button id="logout" class="btn secondary">Esci</button></div></header>
<main class="wrap"><section id="login" class="login"><h1>Accesso amministratore</h1><p>Area privata riservata all’amministratore dell’associazione.</p><form id="loginform" autocomplete="off"><label>Email</label><input id="email" type="email" value="" autocomplete="off" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginbtn" class="btn wide">Accedi</button></form><div id="loginmsg" class="msg" role="status"></div></section>
<section id="dashboard" class="hidden"><h1>Gestione associazione</h1><p>Anagrafica, iscrizioni, pagamenti e amministrazione.</p><div class="grid"><div class="stat"><small>Soci</small><strong id="n-soci">—</strong></div><div class="stat"><small>Iscrizioni</small><strong id="n-iscrizioni">—</strong></div><div class="stat"><small>Pagamenti</small><strong id="n-pagamenti">—</strong></div><div class="stat"><small>Documenti</small><strong id="n-documenti">—</strong></div></div><nav id="nav" class="nav"><button class="active" data-tab="soci">Soci</button><button data-tab="annualita">Annualità</button><button data-tab="iscrizioni">Iscrizioni</button><button data-tab="pagamenti">Pagamenti</button><button data-tab="verbali">Verbali</button><button data-tab="documenti">Documenti</button><button data-tab="movimenti">Rendiconto</button></nav><section class="panel"><div class="panelhead"><div><h2 id="title">Soci</h2><small id="desc">Anagrafica soci</small></div><button id="importSocioPdfTop" class="btn secondary" type="button">Importa socio da PDF</button><button id="reload" class="btn secondary">Aggiorna</button></div><div id="records" class="empty">Caricamento…</div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
(()=>{const db=window.supabase.createClient('https://dccuvlfceuontjniehhf.supabase.co','sb_publishable_hgZeweFGVwpSl3Hrmrk1KQ_hq9mCBxo',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const ADMIN='084247bb-729d-494e-a26a-e003520e0932',EMAIL='gioinsa@inwind.it';const $=id=>document.getElementById(id);let tab='soci';const defs={soci:['Soci','Anagrafica soci',['cognome','nome','codice_socio','telefono','email','stato']],annualita:['Annualità','Anni associativi e quote',['anno','data_inizio','data_fine','quota_base']],iscrizioni:['Iscrizioni','Adesioni annuali',['socio_id','annualita_id','data_iscrizione','stato','importo_quota']],pagamenti:['Pagamenti','Versamenti registrati',['data_pagamento','socio_id','importo','metodo','causale']],verbali:['Verbali','Assemblee e direttivo',['data_verbale','numero','tipo','oggetto']],documenti:['Documenti','Archivio documentale',['titolo','categoria','data_documento','descrizione']],movimenti:['Rendiconto','Entrate e uscite',['data_movimento','tipo','descrizione','importo','metodo']]};const labels={cognome:'Cognome',nome:'Nome',codice_socio:'N. tessera',telefono:'Telefono',email:'Email',stato:'Stato',anno:'Anno',data_inizio:'Inizio',data_fine:'Fine',quota_base:'Quota €',socio_id:'ID socio',annualita_id:'ID annualità',data_iscrizione:'Data',importo_quota:'Quota €',data_pagamento:'Data',importo:'Importo €',metodo:'Metodo',causale:'Causale',data_verbale:'Data',numero:'Numero',tipo:'Tipo',oggetto:'Oggetto',titolo:'Titolo',categoria:'Categoria',data_documento:'Data',descrizione:'Descrizione',data_movimento:'Data'};
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function render(session){if(!session){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('account').classList.add('hidden');return}if(session.user.id!==ADMIN||session.user.email?.toLowerCase()!==EMAIL){await db.auth.signOut();$('loginmsg').textContent='Account non autorizzato.';return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('account').classList.remove('hidden');$('accountmail').textContent=session.user.email;await counts();await load()}
async function counts(){for(const [t,id] of [['soci','n-soci'],['iscrizioni','n-iscrizioni'],['pagamenti','n-pagamenti'],['documenti','n-documenti']]){const {count,error}=await db.from(t).select('*',{count:'exact',head:true});$(id).textContent=error?'—':count}}
async function load(){const [title,desc,cols]=defs[tab];$('title').textContent=title;$('desc').textContent=desc;$('records').textContent='Caricamento…';const {data,error}=await db.from(tab).select('*').limit(150);if(error){$('records').textContent='Errore di lettura: '+error.message;return}if(!data.length){$('records').innerHTML='<div class="empty">Nessun dato registrato per ora.</div>';return}let out='<div class="tablewrap"><table><thead><tr>'+cols.map(k=>'<th>'+esc(labels[k]||k)+'</th>').join('')+'</tr></thead><tbody>';for(const row of data)out+='<tr>'+cols.map(k=>'<td>'+esc(row[k])+'</td>').join('')+'</tr>'; $('records').innerHTML=out+'</tbody></table></div>'}
$('loginform').addEventListener('submit',async e=>{e.preventDefault();$('loginbtn').disabled=true;$('loginmsg').textContent='Controllo credenziali…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginbtn').disabled=false;if(error){$('loginmsg').textContent='Accesso non riuscito: verifica email e password.';return}await render(data.session)});
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('reload').onclick=load;$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));load()};db.auth.getSession().then(({data})=>render(data.session));db.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')render(null)});
})();
$('email').value='';$('password').value='';window.addEventListener('pageshow',()=>{$('email').value='';$('password').value=''});</script><script src="app.js" defer></script></body></html>
